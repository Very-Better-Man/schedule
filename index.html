<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ведутся работы | Академия МВД</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .bg-amia { background-color: #1e3a8a; }
        
        /* Анимация качания для строителя */
        .dig-anim { animation: dig 2s infinite ease-in-out; }
        @keyframes dig {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(-10deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-5px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="fixed top-0 left-0 w-full h-2 bg-amia z-50"></div>
    <div class="fixed top-2 left-0 w-full h-1 bg-yellow-400 z-50"></div>

    <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-8 max-w-sm w-full text-center relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-3" style="background: repeating-linear-gradient(45deg, #fcd34d, #fcd34d 10px, #1e293b 10px, #1e293b 20px);"></div>

        <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mx-auto mt-4 mb-6 border-4 border-blue-100 shadow-inner">
            <i class="fa-solid fa-person-digging text-4xl text-blue-600 dig-anim"></i>
        </div>

        <h1 class="text-xl font-black text-gray-800 uppercase tracking-tight mb-2">Ведутся работы</h1>
        <p class="text-sm text-gray-500 font-medium mb-6 leading-relaxed">
            Сейчас мы обновляем сайт и добавляем новые фишки. Скоро всё заработает!
        </p>

        <div class="w-full bg-gray-100 rounded-full h-2 mb-2 overflow-hidden">
            <div class="bg-blue-500 h-2 rounded-full w-2/3" style="animation: load 2s infinite alternate;"></div>
        </div>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-2">Подождите немного...</p>

    </div>

    <div class="mt-8 text-center text-xs text-gray-400 font-medium flex flex-col items-center gap-2">
        <div class="flex items-center gap-1.5 justify-center">
            <i class="fa-solid fa-shield-halved text-gray-300"></i>
            <span>Расписание ФКМ</span>
        </div>
        <a href="https://t.me/Xgodlyflex" target="_blank" class="inline-flex items-center gap-1.5 text-blue-500 hover:text-blue-600 transition">
            <i class="fa-brands fa-telegram"></i> @Xgodlyflex
        </a>
    </div>

    <style>
        @keyframes load {
            0% { width: 10%; margin-left: 0; }
            100% { width: 30%; margin-left: 70%; }
        }
    </style>
</body>
</html>
